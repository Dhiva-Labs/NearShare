# Package metadata for the NearShare packages beyond the .deb and the snap
# (.rpm, Arch, AUR PKGBUILD, Flatpak). Sourced by bash from build-tree.sh,
# pack.sh, verify.sh and ../arch/aur.sh. Keep it in step with debian/control.

NAME=nearshare
APP_NAME=NearShare
GITHUB_REPO=Dhiva-Labs/NearShare
TAG_PREFIX=v                 # release tags would be v1.2.3
SUMMARY='Quick Share (Nearby Share) for the GNOME desktop'
DESCRIPTION='NearShare is a GTK4/libadwaita implementation of the Quick Share (formerly Nearby Share) wire protocol: mDNS discovery, BLE trigger advertising, UKEY2 key exchange and encrypted transfer framing, so it interoperates with Android and Windows Quick Share, macOS NearDrop and other NearShare instances without cables, a cloud account or a companion app. Every transfer is end-to-end encrypted and confirmed with a 4-digit PIN shown on both screens. Includes the GTK4 app, a nearshare command-line tool and a Nautilus "Send with NearShare" menu item.'
MAINTAINER='Dhiva Labs <dhivakar1010@gmail.com>'
HOMEPAGE=https://github.com/Dhiva-Labs/NearShare
LICENSE=MIT
LICENSE_FILE=LICENSE

# Pure Python, like the .deb (Architecture: all): one noarch .rpm and one
# "any" Arch package, installed on x86_64 and aarch64.
ARCH_INDEPENDENT=1

# The protobuf bindings and the protobuf runtime they need ship inside the
# tree (see build-tree.sh), so protobuf is not a dependency here.
PROTOBUF_VERSION=7.36.2      # the pure-Python runtime in /usr/share/nearshare
GRPCIO_TOOLS_VERSION=1.85.1  # generates the bindings for it

# rpm: the .deb's Depends under Fedora/openSUSE names. Both provide the
# python3-<module> names. The GTK4 and libadwaita typelibs are inside gtk4
# and libadwaita on Fedora; openSUSE splits them into typelib packages
# (typelib(Gtk) = 4.0, typelib(Adw) = 1) and is told apart by its split
# python3-base, which Fedora does not have.
RPM_REQUIRES=(/usr/bin/python3 'python(abi) >= 3.12' python3-gobject python3-zeroconf
  python3-cryptography '(typelib(Gtk) = 4.0 if python3-base else gtk4)'
  '(typelib(Adw) = 1 if python3-base else libadwaita)')
# The .deb's Recommends: Direct mode (nmcli), the BLE trigger (BlueZ) and the
# Nautilus menu item (nautilus-python).
RPM_RECOMMENDS=(NetworkManager bluez '(nautilus-python or python3-nautilus)')
ARCH_DEPENDS=(python python-gobject gtk4 libadwaita python-zeroconf python-cryptography)
ARCH_OPTDEPENDS=('networkmanager: Direct mode (ad-hoc Wi-Fi hotspot)'
  'bluez: BLE trigger so nearby Android phones notice this machine'
  'nautilus-python: Send with NearShare in the Files right-click menu')

# No AppImage: it would have to carry Python, PyGObject, GTK4, libadwaita and
# the whole GLib stack; the Flatpak gets those from the GNOME runtime.
APPIMAGE=0

# Smoke test run in each distribution container by verify.sh and after the
# AUR build by aur.sh: the deb job's checks against the installed package.
GUI_CMD=''
NEEDS_DISPLAY=1
SMOKE_CMD='bash /linux-distros/smoke.sh'
