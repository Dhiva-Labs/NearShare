  - name: nearshare
    buildsystem: simple
    sources:
      - type: dir
        path: tree
        dest: tree
      - type: file
        path: nearshare.sh
      - type: file
        path: dev.dhivalabs.nearshare.metainfo.xml
    build-commands:
      - cp -a tree/usr/share/nearshare /app/share/nearshare
      - install -Dm755 nearshare.sh /app/bin/nearshare
      # Only the main entry: the send and toggle entries (and the Nautilus
      # extension) drive the app from outside, which a sandbox does not offer.
      - install -Dm644 tree/usr/share/applications/dev.dhivalabs.nearshare.desktop /app/share/applications/dev.dhivalabs.nearshare.desktop
      - install -Dm644 tree/usr/share/icons/hicolor/scalable/apps/dev.dhivalabs.nearshare.svg /app/share/icons/hicolor/scalable/apps/dev.dhivalabs.nearshare.svg
      - install -Dm644 dev.dhivalabs.nearshare.metainfo.xml /app/share/metainfo/dev.dhivalabs.nearshare.metainfo.xml
