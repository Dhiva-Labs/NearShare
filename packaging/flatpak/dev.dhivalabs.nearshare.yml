# Flatpak manifest for NearShare.
#
# Like the .rpm and the Arch package, this repackages the installed tree
# that CI builds from the .deb (packaging/linux-distros/build-tree.sh:
# the .deb's files, protobuf bindings regenerated for the bundled
# pure-Python protobuf), unpacked into packaging/flatpak/tree/ by the
# workflow. The GNOME runtime provides Python, PyGObject, GTK4 and
# libadwaita; zeroconf and cryptography are installed from pinned PyPI
# wheels, offline, the way flatpak-pip-generator lays it out. A Flathub
# submission needs `tree` swapped for an archive source; see README.md in
# this directory.
id: dev.dhivalabs.nearshare
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
command: nearshare
finish-args:
  # GTK needs a display socket; fallback-x11 covers X11-only desktops.
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  # mDNS discovery (python-zeroconf's own multicast sockets on port 5353;
  # Avahi is not used) and the transfer connections in both directions.
  - --share=network
  # The BLE trigger advertisement goes through BlueZ on the system bus
  # (org.bluez.LEAdvertisingManager1); no raw Bluetooth sockets are used.
  - --system-talk-name=org.bluez
  # Received files are saved to ~/Downloads.
  - --filesystem=xdg-download
modules:
  - name: python3-deps
    buildsystem: simple
    build-commands:
      - pip3 install --verbose --exists-action=i --no-index --find-links="file://${PWD}"
        --prefix=${FLATPAK_DEST} --no-build-isolation zeroconf cryptography
